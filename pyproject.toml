[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oddball-eeg-classifiability"
version = "1.0.0"
description = "Subject-level classifiability in oddball EEG: a cross-dataset comparison of signal quality and classifier effects."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Seyed Mohammad Amin Miri" },
    { name = "Russell Butler" },
    { name = "Rachid Hedjam" },
]
requires-python = ">=3.10"
keywords = ["EEG", "ERP", "oddball", "P300", "EEGNet", "BCI", "OpenNeuro"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Lower bounds are the versions used for the reported analyses (see environment.yml).
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "scipy>=1.15",
    "scikit-learn>=1.7",
    "statsmodels>=0.14",
    "matplotlib>=3.10",
    "mne>=1.10",
    "mne-bids>=0.17",
    "torch>=2.7",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipython", "pillow", "python-picard>=0.8"]
data = ["openneuro-py>=2025.1"]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5", "nbstripout>=0.7", "pre-commit"]

[project.urls]
Repository = "https://github.com/AminMiri2000/oddball-eeg-classifiability"

[project.scripts]
oddball-eeg-check-config = "oddball_eeg.cli:check_journal_config"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = [
    "E501",   # long lines in data tables and messages
    "B905",   # zip(strict=...) not needed for these call sites
    "UP006",  # keep typing.Dict where already used
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["oddball_eeg"]
