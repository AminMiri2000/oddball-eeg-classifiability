name: CI

on:
  push:
    branches: [main, journal-release]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff nbstripout
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Notebooks have no outputs
        run: |
          find notebooks -name '*.ipynb' -print0 | xargs -0 nbstripout --verify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - run: oddball-eeg-check-config
      - run: pytest
